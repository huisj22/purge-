name: CI

on:
  push:
    branches: ["main", "phase5/**", "phase5.5/**"]
    paths-ignore: ["docs/**", "**/*.md", "reports/**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        # 目标矩阵：3 OS × {22, 24} = 6 组合
        # Node 22 上 node:sqlite 仍需显式 flag；用 NODE_OPTIONS 让子进程同样生效
        node: ["22", "24"]
    env:
      NODE_OPTIONS: ${{ matrix.node == '22' && '--experimental-sqlite' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Toolchain versions
        run: |
          node --version
          pnpm --version
          node -e "console.log('NODE_OPTIONS=' + (process.env.NODE_OPTIONS || ''))"

      - name: Install dependencies (bare pnpm install, no lifecycle hook)
        run: pnpm install --frozen-lockfile=false

      - name: Verify install lifecycle is clean
        run: node scripts/check-install-lifecycle.ts

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests (unit + integration + fault injection)
        run: pnpm test

      - name: Acceptance (simulated host)
        run: pnpm run acceptance

      - name: Package + install smoke
        run: pnpm run ci:install


  package:
    name: build artifact
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Build package
        run: node scripts/package.mjs --out dist/purge-plus.tar.gz
      - name: Verify package
        run: node -e "import('./src/installer/installer.ts').then(async m=>{const v=await m.verifyPackage('dist/purge-plus.tar.gz');console.log(JSON.stringify(v));process.exit(v.ok?0:1)})"
      - uses: actions/upload-artifact@v4
        with:
          name: purge-plus-package
          path: dist/purge-plus.tar.gz
