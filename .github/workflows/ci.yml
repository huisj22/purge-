name: CI

on:
  push:
    branches: ["main", "phase5/**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        # Node 22.5–22.17 不支持默认的 TS type-stripping；本地验证基线为 24
        node: ["24"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests (unit + integration + fault injection)
        run: pnpm test

      - name: Acceptance (simulated host)
        run: pnpm run acceptance

      - name: Package + install smoke
        run: pnpm run ci:install

  package:
    name: build artifact
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - name: Build package
        run: node scripts/package.mjs --out dist/purge-plus.tar.gz
      - name: Verify package
        run: node -e "import('./src/installer/installer.ts').then(async m=>{const v=await m.verifyPackage('dist/purge-plus.tar.gz');console.log(JSON.stringify(v));process.exit(v.ok?0:1)})"
      - uses: actions/upload-artifact@v4
        with:
          name: purge-plus-package
          path: dist/purge-plus.tar.gz
